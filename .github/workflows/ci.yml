# Overall configuration notes:
# - Artifact uploads for binaries are from GHC 9.6.7
# - Builds for Ubuntu happen on 24.04. We also include a single configuration
#   for 22.04 to increase our Linux coverage.
# - Docker builds happen nightly, on manual invocation, and on release branch commits
# Please update this comment as those details change.

# Structural notes:
#
# There is a first "config" job that everything depends on, which
# produces a bunch of configuration data.
#
# We then have these families of jobs:
#    - docs
#    - build
#    - test
#    - other
#
# docs jobs (do not require bins):
#    - build-docs (builds the html docs)
#    - deploy-docs (pushes the html docs to GH Pages)
#    - update-docs-versions (updates the GH Pages index)
#
# build jobs (produce bins)
#    - build (builds saw bins)
#    - build-push-image (builds the docker images)
#
# test jobs (generally require bins)
#    - rocq-builds (builds the Rocq support code)
#    - isabelle-builds (builds the Isabelle support code, does not actually require bins)
#    - crux-mir-comp-tests (runs crux-mir-comp's tests)
#    - saw-remote-api-tests (runs the saw-remote-api tests)
#    - cabal-test (runs all the other cabal-driven test suites)
#    - coverage (runs cabal test with coverage tracking)
#    - s2n-tests (runs the s2n tests in docker containers)
#    - exercises (builds and runs the exercises)
#
# other jobs (do not require bins)
#    - source-archive (extracts a working source archive for releases)


############################################################
#
# Job dispatch config
#

# The whole workflow runs:
#    - if explicitly triggered via the repository's Actions page
#    - once a night
#    - on updates to pull requests
#    - a tag matching either of the version string patterns is pushed
#      (this is for tagged releases)
#    - a push is made to master (this happens when PRs are merged)
#    - a push is made to a release/stable branch
#      (this happens when PRs are merged there)
#
# Note that in general a release will get built twice: once when the
# final commit is merged to the release branch or the release branch
# is created (as a stable branch build), and again when the tag for
# the release is pushed (as a tag build). Some jobs are attached to
# one or the other of these, and some to both.
#
# Also note that it's apparently impossible to directly restrict
# scheduled runs to the original repository; they will also always run
# in forks. All logic that triggers on scheduled runs needs to also
# check whether the repository is ours if appropriate.
# See https://github.com/orgs/community/discussions/16109.

name: SAWScript
on:
  workflow_dispatch:
  schedule:
    - cron: "0 10 * * *" # 10am UTC -> 2/3am PST
  pull_request:
  push:
    tags:
      - "v?[0-9]+.[0-9]+"
      - "v?[0-9]+.[0-9]+.[0-9]+"
    branches: [master, "release-**"]

############################################################
#
# Setup
#

#
# The various *_CACHE_VERSION environment variables can be updated to
# force the use of a new cache if the respective current cache
# contents become corrupted/invalid. This can sometimes happen when
# (for example) the OS version is changed but older .so files are
# cached, which can have various effects (e.g. cabal complains it
# can't find a valid version of the "happy" tool).
#
#    CABAL_CACHE_VERSION controls the cache of the Cabal store used by
#       the main SAW build.
#    CARGO_CACHE_VERSION controls the cache of the Cargo store used by
#       the mir-json build.
#    SPHINX_CACHE_VERSION controls the cache of the Python virtual
#       environment used by the documentation build.
#    SOLVER_CACHE_VERSION controls the cached version of the SAW
#       solver cache used by the test suite.
#
# DISABLED_TESTS turns off specific tests in the `intTests` test suite.
# Doesn't actually work right; see #3092.
#
# RUST_TOOLCHAIN sets the Rust version we're using. This should be the one
# supported by the mir-json submodule.
#
# SOLVER_PKG_VERSION is the name of the what4-solvers snapshot we use. This
# should ordinarily be the latest one.
#
env:
  CABAL_CACHE_VERSION: 12
  CARGO_CACHE_VERSION: 1
  SOLVER_CACHE_VERSION: 1

  DISABLED_TESTS: "test0000 test_FNV_a1_rev test0010_jss_cnf_exp test0039_rust test_boilerplate test_external_abc"

  # If you update this, make sure to also update RUST_TOOLCHAIN in
  # crux-mir-comp/Dockerfile.
  RUST_TOOLCHAIN: "nightly-2026-03-21"

  # Solver package snapshot date - also update in the following locations:
  # ./crux-mir-comp/Dockerfile
  # ./saw/Dockerfile
  # ./saw-remote-api/Dockerfile
  SOLVER_PKG_VERSION: "snapshot-20260622"

############################################################
#
# Job config
#

jobs:
  config:
    name: Configure this build
    runs-on: ubuntu-24.04
    outputs:

      # string outputs (names and versions)
      name: ${{ steps.settings.outputs.name }}
      saw-version: ${{ steps.settings.outputs.saw-version }}
      crux-name: ${{ steps.settings.outputs.crux-name }}
      crux-version: ${{ steps.settings.outputs.crux-version }}

      # boolean outputs characterizing the build we're doing
      event-is-tag: ${{ steps.settings.outputs.event-is-tag }}
      event-is-master: ${{ steps.settings.outputs.event-is-master }}
      event-is-stable-branch: ${{ steps.settings.outputs.event-is-stable-branch }}
      event-is-scheduled: ${{ steps.settings.outputs.event-is-scheduled }}
      event-is-dispatch: ${{ steps.settings.outputs.event-is-dispatch }}
      event-is-pr: ${{ steps.settings.outputs.event-is-pr }}

      # boolean outputs characterizing what we want to do in this build
      want-deploy-docs: ${{ steps.settings.outputs.want-deploy-docs }}
      want-signing: ${{ steps.settings.outputs.want-signing }}
      want-apple-notarization: ${{ steps.settings.outputs.want-apple-notarization }}
      want-docker-images: ${{ steps.settings.outputs.want-docker-images }}
      want-coverage: ${{ steps.settings.outputs.want-coverage }}
      want-source-archive: ${{ steps.settings.outputs.want-source-archive }}

      # other config outputs
      retention-days: ${{ steps.settings.outputs.retention-days }}
    steps:
      - name: "Check out repository (depth 0)"
        uses: actions/checkout@v7
        with:
          submodules: false
          fetch-depth: 0

      - name: Issue build settings
        id: settings
        env:
          # get the event name for this build
          EVENT_NAME: ${{ github.event_name }}
          # get the git ref associated with this build
          # note that github.event.ref also exists but does not seem to always work
          EVENT_REF: ${{ github.ref }}

          # This is true if the build is running in the real repository and
          # not a fork. Dependabot runs apparently behave like forks but don't
          # appear that way and need to be excluded explicitly. This should
          # be checked for anything that requires secrets or otherwise
          # won't work in a fork. See #2216 and Crucible #1642 for
          # further discussion.
          EVENT_IS_OURS: ${{ github.event.pull_request.head.repo.fork == false && github.repository_owner == 'GaloisInc' && github.actor != 'dependabot[bot]' }}

        run: |
          set -x
          # string outputs (names and versions)
          .github/ci.sh output name saw-$(.github/ci.sh saw_ver)
          .github/ci.sh output saw-version $(.github/ci.sh saw_ver)
          .github/ci.sh output crux-name crux-mir-comp-$(.github/ci.sh crux_ver)
          .github/ci.sh output crux-version $(.github/ci.sh crux_ver)

          # output the "ours" info
          .github/ci.sh output event-is-ours $EVENT_IS_OURS

          # Figure out how this build was triggered and generate corresponding
          # boolean outputs.
          .github/ci.sh configure_for_event $EVENT_NAME $EVENT_REF $EVENT_IS_OURS

      - name: Fail if the classification did not work
        if: steps.settings.outputs.event-type == 'unknown'
        run: false

############################################################
#
# Documentation jobs
#

# All of this is indented two spaces because it actually hangs under
# the "jobs:" line in the "job config" section above.

  # Always build the docs (in case they don't)
  build-docs:
    name: "Build SAW documentation"
    needs: [config]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Check out repository (no submodules)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Cache Python environment
        uses: actions/cache@v6
        with:
          path: doc/.venv
          key: ${{ env.SPHINX_CACHE_VERSION }}-sphinx-${{ matrix.os }}-${{ hashFiles('doc/scripts/requirements.txt') }}

      - name: Build HTML documentation
        run: make -C doc html
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v5
        with:
          name: html_docs
          path: doc/_build/html/

  # This runs only when the run config says to deploy the docs
  deploy-docs:
    name: "Deploy SAW documentation to GitHub Pages"
    needs: [config, build-docs]
    runs-on: ${{ matrix.os }}
    if: needs.config.outputs.want-deploy-docs == true
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Report relevant config
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "want-deploy-docs: ${{ needs.config.outputs.want-deploy-docs }}"

      - name: Check out repository (no submodules)
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Download HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: html_docs
          path: doc/_build/html

      # Adapted from:
      # https://github.com/brechtm/rinohtype/commit/8a23be41d39d748955b139f0fabefe3205a4fd93
      # Based on the Stack Overflow thread:
      # https://stackoverflow.com/questions/72089650/how-to-host-multiple-version-of-a-sphinx-based-documentation-on-github
      - name: Determine documentation publishing directory
        id: doc-publish-dir
        run: python3 .github/save_doc_publish_dir.py

      # Using peaceiris/actions-gh-pages, as it allows us to specify specific
      # target directories to publish to, where the built-in actions are
      # "one and done": Package and upload a single artifact, and deploy that.
      - name: Publish docs to GitHub pages
        if: steps.doc-publish-dir.outputs.target != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: doc/_build/html
          destination_dir: ${{ steps.doc-publish-dir.outputs.target }}
          keep_files: false

  # Adapted from:
  # https://github.com/brechtm/rinohtype/commit/6ba7637c248add1ce90efa7bb1c761d690b0de17
  #
  # By depending on deploy-docs, this runs only when the run config
  # says to deploy the docs.
  update-docs-versions:
    name: "Update documentation versions JSON"
    needs: [config, deploy-docs]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
    steps:
      - name: Report relevant config
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "want-deploy-docs: ${{ needs.config.outputs.want-deploy-docs }}"

      - name: Check out gh-pages
        uses: actions/checkout@v7
        with:
          ref: gh-pages

      - name: Write versions to JSON file
        run: |
          python3 -c "
          import json
          from pathlib import Path

          cwd = Path.cwd()
          versions = sorted(
              (
                  item.name
                  for item in cwd.iterdir()
                  if item.is_dir() and not item.name.startswith('.') and item.name != 'coverage'
              ),
              reverse=True,
          )
          target_dir = Path('gh-pages')
          target_dir.mkdir(parents=True)
          target_file = target_dir / 'versions.json'
          with target_file.open('w') as f:
              json.dump(versions, f)"

      - name: Publish versions JSON to GitHub pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: gh-pages
          keep_files: true

############################################################
#
# Build jobs
#

# All of this is indented two spaces because it actually hangs under
# the "jobs:" line in the "job config" section above.

  build:
    name: "Build on ${{ matrix.os }} with GHC ${{ matrix.ghc }}: haddock=${{ matrix.haddock }} tests=${{ matrix.run-tests }} coverage=${{ matrix.hpc }}"
    runs-on: ${{ matrix.os }}
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
        cabal: ["3.14.1.0"]
        ghc: ["9.4.8", "9.6.7", "9.8.4"]
        haddock: [true]
        run-tests: [true]
        hpc: [false]
        include:
          # We include one job from an older Ubuntu LTS release to increase our
          # coverage of possible Linux configurations. Since we already run the
          # tests with the newest LTS release, we won't bother testing this one.
          - os: ubuntu-22.04
            ghc: "9.6.7"
            cabal: "3.14.1.0"
            haddock: false
            run-tests: false
            hpc: false
          # Include one job with HPC enabled
          - os: ubuntu-24.04
            ghc: "9.6.7"
            cabal: "3.14.1.0"
            haddock: false
            run-tests: true
            hpc: true
          # Windows and macOS CI runners are more expensive than Linux runners,
          # so we only build one particular GHC version to test them on. We
          # include both an x86-64 macOS runner (macos-15-intel) as well as an
          # AArch64 (arm64) macOS runner (macos-15).
          - os: windows-2022
            ghc: 9.6.7
            haddock: false
            run-tests: true
            hpc: false
          - os: macos-15-intel
            ghc: 9.6.7
            haddock: false
            run-tests: true
            hpc: false
          - os: macos-15
            ghc: 9.6.7
            haddock: false
            run-tests: true
            hpc: false
    outputs:
      cabal-test-suites-json: ${{ steps.cabal-test-suites.outputs.targets-json }}
    steps:
      - name: Report relevant config
        run: |
          echo "OS: ${{ matrix.os }}"
          echo "GHC: ${{ matrix.ghc }}"
          echo "Haddock: ${{ matrix.haddock }}"
          echo "Run tests: ${{ matrix.run-tests }}"
          echo "Coverage (HPC): ${{ matrix.hpc }}"
          echo "Want signing: ${{ needs.config.outputs.want-signing }}"
          echo "Want notarization: $$ {{ needs.config.outputs.want-apple-notarization }}"

      - name: Check out repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Build job configuration
        id: config
        shell: bash
        run: |
          NAME="${{ needs.config.outputs.name }}-${{ matrix.os }}-${{ runner.arch }}"
          .github/ci.sh output name $NAME
          echo "NAME=${{ needs.config.outputs.name }}-${{ matrix.os }}-${{ runner.arch }}" >> $GITHUB_ENV
          CRUX_NAME="${{ needs.config.outputs.crux-name }}-${{ matrix.os }}-${{ runner.arch }}"
          .github/ci.sh output crux-name $CRUX_NAME
          echo "CRUX_NAME=${{ needs.config.outputs.crux-name }}-${{ matrix.os }}-${{ runner.arch }}" >> $GITHUB_ENV

      # On macOS, import the signing certificate, which we will use later to
      # sign the binaries after they have been built.
      # Do not run this step in forks, as this requires repo-specific secrets.
      - name: Import signing certificate (macOS)
        uses: apple-actions/import-codesign-certs@v7
        if: runner.os == 'macOS' && needs.config.outputs.want-signing == true
        with:
          p12-file-base64: ${{ secrets.APPLE_P12_CERTIFICATE }}
          p12-password: ${{ secrets.APPLE_P12_PASSWORD }}

      - name: Set up Haskell
        id: setup-haskell
        uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: ${{ matrix.cabal }}

      - name: Post-GHC installation fixups on Windows
        shell: bash
        if: runner.os == 'Windows'
        run: |
          # A workaround for https://github.com/Mistuke/CabalChoco/issues/5
          cabal user-config update -a "extra-include-dirs: \"\""
          cabal user-config update -a "extra-lib-dirs: \"\""

      - name: Download what4-solvers
        uses: GaloisInc/what4-solvers@v1
        with:
          dest: bin
          release: ${{ env.SOLVER_PKG_VERSION }}

      - name: Add what4-solvers to GITHUB_PATH
        shell: bash
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Restore cabal store cache
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CABAL_CACHE_VERSION }}-cabal-${{ matrix.os }}-${{ matrix.ghc }}-${{ hashFiles(format('cabal.GHC-{0}.config', matrix.ghc)) }}-${{ github.sha }}
          restore-keys: |
            ${{ env.CABAL_CACHE_VERSION }}-cabal-${{ matrix.os }}-${{ matrix.ghc }}-${{ hashFiles(format('cabal.GHC-{0}.config', matrix.ghc)) }}-

      - name: Build SAW
        shell: bash
        run: .github/ci.sh build
        env:
          ENABLE_HPC: ${{ matrix.hpc }}

      - name: Build Cryptol
        shell: bash
        run: .github/ci.sh build_cryptol

      - name: Run Haddock
        if: matrix.haddock == true
        shell: bash
        run: .github/ci.sh haddock

      - name: Collect test bins
        id: cabal-test-suites
        uses: GaloisInc/.github/actions/cabal-collect-bins@v1.1.1
        with:
          # Keep this list in sync. There are four lists of tests:
          #   - here
          #   - build.sh (in the "build" target)
          #   - doc/developer/developer.md
          #   - and of course the definitions in the *.cabal files
          targets: |
            integration-tests
            saw-core-tests
            cryptol-saw-core-tests
            crux-mir-comp-tests
            saw-core-rocq-tests
            saw-core-isabelle-tests
          dest: dist-tests

      # In the next 2 steps, we upload to different names depending on whether
      # the binaries were compiled using HPC or not. This is done to ensure that
      # the HPC-enabled binaries do not clobber the non-HPC-enabled binaries.
      - name: Upload non-coverage test bins
        uses: actions/upload-artifact@v5
        if: matrix.ghc == '9.6.7' && matrix.hpc == false
        with:
          path: dist-tests
          name: dist-tests-${{ matrix.os }}

      - name: Upload with-coverage test bins
        uses: actions/upload-artifact@v5
        if: matrix.ghc == '9.6.7' && matrix.hpc == true
        with:
          path: dist-tests
          name: dist-tests-${{ matrix.os }}-hpc

      - name: Collect SAW and Cryptol bins
        shell: bash
        run: .github/ci.sh setup_dist_bins

      - name: Collect Crux bins
        shell: bash
        run: .github/ci.sh setup_crux_dist_bins dist-crux

      # On macOS, code sign the binaries to verify that Galois is the author.
      # Do not run this step in forks, as this requires repo-specific secrets.
      - name: Sign binaries (macOS)
        if: runner.os == 'macOS' && needs.config.outputs.want-signing == true
        env:
          IDENTITY_NAME: ${{ secrets.APPLE_P12_IDENTITY_NAME }}
        run: |
          codesign \
            --force \
            --options runtime \
            --sign "$IDENTITY_NAME" \
            dist/bin/* dist-crux/bin/*

      # On macOS, notarize the binaries so that users can run them without
      # needing to whitelist them.
      - name: Notarize binaries (macOS)
        if: runner.os == 'macOS' && needs.config.outputs.want-signing == true && needs.config.outputs.want-apple-notarization == true
        env:
          KEY_ID: ${{ secrets.APPLE_P8_KEY_ID }}
          ISSUER_ID: ${{ secrets.APPLE_P8_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_P8_API_KEY }}
        run: |
          zip binaries.zip dist/bin/* dist-crux/bin/*
          echo "$API_KEY" > "AuthKey_$KEY_ID.p8"
          xcrun notarytool submit binaries.zip \
            --key "AuthKey_$KEY_ID.p8" \
            --key-id "$KEY_ID" \
            --issuer "$ISSUER_ID" \
            --wait

      - name: Create SAW binary distribution tree
        shell: bash
        run: .github/ci.sh bundle_files

      - name: Zip up the SAW non-solvers binary distribution
        shell: bash
        run: .github/ci.sh zip_dist $NAME

      - name: Zip up the SAW with-solvers binary distribution
        shell: bash
        run: .github/ci.sh zip_dist_with_solvers $NAME-with-solvers

      - name: Zip up the Crux binary distribution
        shell: bash
        run: .github/ci.sh zip_dist $CRUX_NAME dist-crux

      # Restrict this step so it only runs when the secrets needed are
      # available.
      - name: Sign the binary distributions
        if: matrix.ghc == '9.6.7' && needs.config.outputs.want-signing == true
        shell: bash
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
        run: .github/ci.sh sign $NAME.tar.gz $NAME-with-solvers.tar.gz $CRUX_NAME.tar.gz

      ##########################################################################
      # We upload an archive containing SAW, and also and archive containing SAW
      # and the set of possible SMT solvers, but only for our "primary"
      # distribution (currently: GHC 9.6.7).  These archives are utilized in
      # subsequent CI jobs, but are also published for external users, and are
      # therefore signed.
      #
      # In addition, if we built with HPC, we upload a tarball containing the
      # HPC-enabled binaries and HPC-specific files generated during the build
      # process.  These are mostly used for subsequent CI jobs that will
      # generate a coverage report, and the binaries are essentially the same as
      # those collected for the previous operation, but they are captured in
      # their original cabal-generated locations where they are expected to live
      # for subsequent coverage collection.

      # In the next 3 steps we check that `matrix.hpc == false` so that if the
      # distribution version matches the HPC version, the HPC build artifacts do
      # not clobber the non-HPC distribution artifacts.
      - name: Upload the SAW non-solvers binary distribution
        if: matrix.ghc == '9.6.7' && matrix.hpc == false
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.config.outputs.name }} (GHC ${{ matrix.ghc }})
          path: "${{ steps.config.outputs.name }}.tar.gz*"
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.retention-days }}

      - name: Upload the SAW with-solvers binary distribution
        if: matrix.ghc == '9.6.7' && matrix.hpc == false
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.config.outputs.name }}-with-solvers
          path: "${{ steps.config.outputs.name }}-with-solvers.tar.gz*"
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.retention-days }}

      - name: Upload the Crux binary distribution
        if: matrix.ghc == '9.6.7' && matrix.hpc == false
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.config.outputs.crux-name }} (GHC ${{ matrix.ghc }})
          path: "${{ steps.config.outputs.crux-name }}.tar.gz*"
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.retention-days }}

      - name: Upload the non-coverage test bins
        if: matrix.ghc == '9.6.7' && matrix.run-tests && matrix.hpc == false
        uses: actions/upload-artifact@v5
        with:
          path: dist/bin
          name: ${{ matrix.os }}-bins

      - name: Collect the coverage-testing files
        if: matrix.hpc == true
        shell: bash
        run: .github/ci.sh collect_hpc_files

      - name: Upload the coverage-testing files
        if: matrix.hpc == true
        uses: actions/upload-artifact@v5
        with:
          path: hpc.tar.gz
          name: ${{ matrix.os }}-hpc.tar.gz

      - name: Save cabal store cache
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ${{ steps.setup-haskell.outputs.cabal-store }}
            dist-newstyle
          key: ${{ env.CABAL_CACHE_VERSION }}-cabal-${{ matrix.os }}-${{ matrix.ghc }}-${{ hashFiles(format('cabal.GHC-{0}.config', matrix.ghc)) }}-${{ github.sha }}

  build-push-image:
    name: "Build the ${{ matrix.which }} docker image"
    runs-on: ubuntu-24.04
    needs: [config]
    # Restrict this to the main repository where the needed secrets
    # will be available. As noted above, scheduled runs also happen in
    # forks. It would be nice to run all of it but the final push step,
    # but we appear to need docker login to build.
    if: needs.config.outputs.want-docker-images == true
    strategy:
      fail-fast: false
      matrix:
        include:
          - which: saw
            file: saw/Dockerfile
            image: ghcr.io/galoisinc/saw
            cache: ghcr.io/galoisinc/cache-saw
            image-repo: GaloisInc/saw-script
            image-tag: ${{ needs.config.outputs.saw-version }}
          - which: saw-remote-api
            file: saw-remote-api/Dockerfile
            image: ghcr.io/galoisinc/saw-remote-api
            cache: ghcr.io/galoisinc/cache-saw-remote-api
            image-repo: GaloisInc/saw-script
            image-tag: ${{ needs.config.outputs.saw-version }}
          - which: crux-mir-comp
            file: crux-mir-comp/Dockerfile
            image: ghcr.io/galoisinc/crux-mir-comp
            cache: ghcr.io/galoisinc/cache-crux-mir-comp
            image-repo: GaloisInc/crux
            image-tag: ${{ needs.config.outputs.crux-version }}
    steps:
      - name: Report relevant config
        run: |
          echo "Want docker images: ${{ needs.config.outputs.want-docker-images }}"
          echo "File: ${{ matrix.file }}"
          echo "Image: ${{ matrix.image }}"
          echo "Cache image: ${{ matrix.cache }}"
          echo "Repo: ${{ matrix.image-repo }}"
          echo "Tag: ${{ matrix.image-tag }}"

      - name: Check out the repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Capture git state in GitRev.hs
        run: ./build.sh gitrev

      - name: Clear up some disk space
        run: |
          # The crux-mir-comp Docker image is rather large (~1GB compressed),
          # and the mere act of building the image requires just over 14 GB of
          # disk space, which exceeds the maximum provided by a GitHub Action
          # CI runner. To clear up some extra space, we delete ~10GB worth of
          # pre-installed GitHub Actions tools, none of which we make use of.
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" # Python installations

      - uses: rlespinasse/github-slug-action@v3.x

      - name: Set COMMON_TAG
        id: common-tag
        run: |
          echo "::set-output name=common-tag::$GITHUB_REF_SLUG"
          echo "COMMON_TAG=$GITHUB_REF_SLUG" >> $GITHUB_ENV

      - name: Docker build setup
        uses: docker/setup-buildx-action@v3

      - name: Docker labels
        id: labels
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          labels: |
             org.opencontainers.image.source=https://github.com/${{ matrix.image-repo }}

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Do the image build
        uses: docker/build-push-action@v6
        with:
          context: .
          tags: ${{ matrix.image }}:${{ steps.common-tag.outputs.common-tag }}
          labels: ${{ steps.labels.outputs.labels }}
          load: true
          push: false
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          cache-from: |
            type=registry,ref=${{ matrix.cache }}:${{ steps.prefix.outputs.prefix }}master
            type=registry,ref=${{ matrix.cache }}:${{ steps.common-tag.outputs.common-tag }}

      - name: Cache the image build
        uses: docker/build-push-action@v6
        continue-on-error: true  # Tolerate cache upload failures - this should be handled better
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: ${{ matrix.build-args }}
          cache-to: type=registry,ref=${{ matrix.cache }}:${{ steps.common-tag.outputs.common-tag }},mode=max

      - name: Set up Python
        if: matrix.image == 'ghcr.io/galoisinc/saw-remote-api'
        uses: actions/setup-python@v6
        with:
          # Ensure that this matches saw-python/mypy.ini file
          # and that saw-python/pyproject.toml file is compatible with this version
          python-version: '3.12'

      - name: Set up Poetry
        if: matrix.image == 'ghcr.io/galoisinc/saw-remote-api'
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 2.4.1

      - name: Test saw-remote-api
        if: matrix.image == 'ghcr.io/galoisinc/saw-remote-api'
        run: ./saw-remote-api/scripts/test_docker.sh ${{ matrix.image }}:$COMMON_TAG

        # Scheduled events upload as "nightly"
      - name: Upload ${{ matrix.image }}:nightly
        if: needs.config.outputs.event-is-scheduled == 'true'
        run: |
          docker tag ${{ matrix.image }}:$COMMON_TAG ${{ matrix.image }}:nightly
          docker push ${{ matrix.image }}:nightly

        # Stable branch events upload by the version
      - name: Upload ${{ matrix.image }}:${{ matrix.image-tag }}
        if: needs.config.outputs.event-is-stable-branch == 'true'
        run: |
          docker tag ${{ matrix.image }}:$COMMON_TAG ${{ matrix.image }}:${{ matrix.image-tag }}
          docker push ${{ matrix.image }}:${{ matrix.image-tag }}
          docker tag ${{ matrix.image }}:$COMMON_TAG ${{ matrix.image }}:latest
          docker push ${{ matrix.image }}:latest

############################################################
#
# Test jobs
#

# All of this is indented two spaces because it actually hangs under
# the "jobs:" line in the "job config" section above.

  rocq-builds:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out the repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download what4-solvers
        uses: GaloisInc/what4-solvers@v1
        with:
          dest: bin
          release: ${{ env.SOLVER_PKG_VERSION }}

      - name: Add what4-solvers to GITHUB_PATH
        shell: bash
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Download the SAW bins
        uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.os }}-bins"
          path: dist/bin

      - name: Update PATH to include SAW
        shell: bash
        run: |
          chmod +x dist/bin/*
          echo $GITHUB_WORKSPACE/dist/bin >> $GITHUB_PATH

      - name: Set up OCaml
        uses: ocaml/setup-ocaml@v3
        with:
          ocaml-compiler: "4.14"

      - name: Add Rocq upstream to opam
        run: opam repo add rocq-released https://rocq-prover.org/opam/released

      - name: Install rocq-prover
        run: opam pin add -y rocq-prover 9.0.0

      - name: Install rocq-core and rocq-stdlib
        run: opam install -y rocq-core=9.1.0 rocq-stdlib=9.0.0

      # Install coq-bits from source. FIXME: replace with compatible
      # opam-released version when available.
      - name: Install coq-bits
        working-directory: saw-core-rocq/rocq
        run: |
          opam install -y coq=9.1.0 # coq-* packages include compatibility shims (e.g., coq_makefile).
          opam pin -y coq-bits https://github.com/rocq-community/bits.git#f50fc3e5f1eabcb0b0b94c8d25f75e61a255c2ba

      # FIXME: the following steps generate Rocq libraries for the SAWCore to
      # Rocq translator and builds them; if we do other Rocq tests, these steps
      # should become their own build artifact, to avoid re-compiling the Rocq
      # libraries
      - name: Build the handwritten Rocq infrastructure
        working-directory: saw-core-rocq/rocq
        shell: bash
        run: opam exec -- make -j

      # Regenerate the test .v files, since we don't have the ones from the
      # test run and rebuilding them isn't super expensive.
      - name: Regen the saw-core-rocq-tests outputs
        working-directory: otherTests/saw-core-rocq
        shell: bash
        run: SAW=saw sh ./test.sh

      # Now build, or try to build, all the output files.
      - name: Build the saw-core-rocq-tests outputs
        working-directory: otherTests/saw-core-rocq
        shell: bash
        run: opam exec -- make -j rocq

  isabelle-builds:
    needs: [config]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      # commits with Isabelle2025-2 tag in mercurial repos
      ISABELLE_COMMIT: '8d9ad3f2984ab945542dad1a0802f0c1b0517337'
      AFP_COMMIT: '9db853f97465cce2ce1ed731b4c8ba94187ea650'
    steps:
      - name: Check out the repository without submodules
        uses: actions/checkout@v7
        with:
          submodules: false

      - name: Check out Isabelle
        uses: actions/checkout@v7
        with:
          repository: 'isabelle-prover/mirror-isabelle'
          ref: ${{ env.ISABELLE_COMMIT }}
          path: isabelle

      - name: Check out AFP
        uses: actions/checkout@v7
        with:
          repository: 'isabelle-prover/mirror-afp-devel'
          ref: ${{ env.AFP_COMMIT }}
          path: afp

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y curl perl

      - name: Restore cached Isabelle user directory
        id: cache-isabelle-restore
        uses: actions/cache/restore@v6
        with:
          path: |
            ~/.isabelle/contrib
            ~/.isabelle/heaps
          key: ${{ runner.os }}-isabelle-${{ env.ISABELLE_COMMIT }}-afp-${{ env.AFP_COMMIT }}
          restore-keys: |
            ${{ runner.os }}-isabelle-

      - name: Initialize Isabelle components
        run: ./isabelle/Admin/init

      - name: Add Isabelle to PATH
        run: echo "${{ github.workspace }}/isabelle/bin" >> $GITHUB_PATH

      - name: Add AFP as Isabelle Component
        run: isabelle components -u ${{ github.workspace }}/afp/thys

      - name: "Build base Cryptol image"
        run: |
          isabelle components -u "$PWD/saw-core-isabelle/isabelle"
          isabelle build -b Cryptol_Base

      - name: "Build test image"
        run: |
          isabelle components -u "$PWD/otherTests/saw-core-isabelle"
          isabelle build Cryptol_Tests

      - name: Update cached Isabelle user directory
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.isabelle/contrib
            ~/.isabelle/heaps
          key: ${{ steps.cache-isabelle-restore.outputs.cache-primary-key }}

  crux-mir-comp-tests:
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repo and submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Install Rust toolchain
        uses: actions-rs/toolchain@v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          override: true
          components: rustc-dev, rust-src

      - name: Engage the Cargo cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: "true"
          prefix-key: "${{ env.CARGO_CACHE_VERSION }}-${{ matrix.os }}"
          shared-key: "cargo-cache"
          workspaces: "deps/mir-json"

      - name: Download what4-solvers
        uses: GaloisInc/what4-solvers@v1
        with:
          dest: bin
          release: ${{ env.SOLVER_PKG_VERSION }}

      - name: Add what4-solvers to GITHUB_PATH
        shell: bash
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Install mir-json
        working-directory: deps/mir-json
        run: |
          cargo install --locked --force
          mir-json-translate-libs
          echo "CRUX_RUST_LIBRARY_PATH=$(pwd)/rlibs" >> $GITHUB_ENV

      - name: Download test binaries
        uses: actions/download-artifact@v4
        with:
          name: dist-tests-${{ matrix.os }}
          path: dist-tests

      - name: Update PATH to include crux-mir-comp
        shell: bash
        run: |
          chmod +x dist-tests/*
          echo $GITHUB_WORKSPACE/dist-tests >> $GITHUB_PATH

      - name: Run crux-mir-comp test suite
        continue-on-error: ${{ matrix.continue-on-error }}
        working-directory: crux-mir-comp
        shell: bash
        run: crux-mir-comp-tests

  saw-remote-api-tests:
    name: "saw-remote-api-tests (${{ matrix.name }} on ${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Install and test
            test: saw-remote-api/scripts/run_rpc_tests.sh
            os: ubuntu-24.04
          # TODO: saw-remote-api unit tests are disabled pending a fix for #1699
          - name: Install only
            test: |
              cd saw-python/
              poetry install
              poetry run mypy --install-types --non-interactive saw_client/ || true
              poetry run mypy --install-types --non-interactive saw_client/
            os: macos-15
          - name: Check docs
            test: saw-remote-api/scripts/check_docs.sh
            os: ubuntu-24.04
    steps:
      - name: Check out the repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download what4-solvers
        uses: GaloisInc/what4-solvers@v1
        with:
          dest: bin
          release: ${{ env.SOLVER_PKG_VERSION }}

      - name: Add what4-solvers to GITHUB_PATH
        shell: bash
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Download the SAW bins
        uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.os }}-bins"
          path: dist/bin

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # Ensure that this matches saw-python/mypy.ini file
          # and that saw-python/pyproject.toml file is compatible with this version
          python-version: '3.12'

      - name: Set up Poetry
        uses: abatilo/actions-poetry@v4
        with:
          poetry-version: 2.4.1

      - name: "Run the tests: ${{ matrix.name }}"
        shell: bash
        run: |
          chmod +x dist/bin/*
          export PATH="$PWD/dist/bin:$PATH"
          echo "$PWD/dist/bin" >> "$GITHUB_PATH"
          abc -h || true
          yices --version
          yices-smt2 --version
          saw --version
          saw-remote-api --help
          ${{ matrix.test }}

  cabal-test:
    name: "cabal-test ${{ matrix.suite }} (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    needs: [build]
    strategy:
      fail-fast: false
      matrix:
        suite: ${{ fromJson(needs.build.outputs.cabal-test-suites-json) }}
        os: [ubuntu-24.04]
        continue-on-error: [false]
        include:
          - suite: integration-tests
            os: macos-15
            continue-on-error: false
          - suite: integration-tests
            os: windows-2022
            timeout-minutes: 60
            continue-on-error: true  # https://github.com/GaloisInc/saw-script/issues/2648
        exclude:
          - suite: integration-tests
            os: windows-2022
            continue-on-error: false
          # We exclude crux-mir-comp-tests as it requires some Rust-specific
          # setup that is unique to that particular test suite. See the
          # crux-mir-comp-tests job, which is defined separately.
          - suite: crux-mir-comp-tests
    steps:
      - name: Report relevant config
        run: |
          echo "Runner OS: ${{ runner.os }}"
          echo "Suite: ${{ matrix.suite }}"
          echo "Continue on error: ${{ matrix.continue-on-error }}"

      - name: Check out the repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download what4-solvers
        uses: GaloisInc/what4-solvers@v1
        with:
          dest: bin
          release: ${{ env.SOLVER_PKG_VERSION }}

      - name: Add what4-solvers to GITHUB_PATH
        shell: bash
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Download the SAW bins
        uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.os }}-bins"
          path: dist/bin

      - name: Chmod the bins
        shell: bash
        if: runner.os != 'Windows'
        run: chmod +x dist/bin/*

      - name: Chmod more bins
        shell: bash
        if: runner.os != 'Windows'
        run: chmod +x bin/*

      - name: Download the test bins
        uses: actions/download-artifact@v4
        with:
          name: dist-tests-${{ matrix.os }}
          path: dist-tests

      - name: Chmod the test bins
        shell: bash
        if: runner.os != 'Windows'
        run: chmod +x dist-tests/*

      - name: Set up Java
        uses: actions/setup-java@v5
        if: matrix.suite == 'integration-tests'
        with:
          distribution: "zulu"
          java-version: "8"
          java-package: jdk

      - name: Restore SMT solver result cache
        uses: actions/cache/restore@v6
        if: matrix.suite == 'integration-tests'
        with:
          path: ${{ matrix.suite }}.cache
          key: ${{ env.SOLVER_CACHE_VERSION }}-solver-${{ matrix.suite }}-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.SOLVER_CACHE_VERSION }}-solver-${{ matrix.suite }}-${{ matrix.os }}-

      - name: Enable solver caching
        shell: bash
        if: matrix.suite == 'integration-tests'
        run: |
          echo "SAW_SOLVER_CACHE_PATH=$(pwd)/${{ matrix.suite }}.cache" >> "$GITHUB_ENV"
          dist/bin/saw --clean-mismatched-versions-solver-cache=$(pwd)/${{ matrix.suite }}.cache

      - name: Run test suite ${{ matrix.suite }}
        continue-on-error: ${{ matrix.continue-on-error }}
        shell: bash
        run: |
          export PATH="$PWD/dist/bin:$PATH"
          dist-tests/${{ matrix.suite }}

      - name: Save SMT solver result cache
        uses: actions/cache/save@v6
        if: matrix.suite == 'integration-tests'
        with:
          path: ${{ matrix.suite }}.cache
          key: ${{ env.SOLVER_CACHE_VERSION }}-solver-${{ matrix.suite }}-${{ matrix.os }}-${{ github.sha }}

  # The coverage job is similar to the cabal-test job, but it only runs the HPC
  # enabled SAW build against the integration test suite. It then collects the
  # test coverage results, generates an HTML summary, and publishes the results
  # to github pages.
  coverage:
    name: "Run integration tests with coverage reporting (${{ matrix.os }})"
    needs: [config, build]
    runs-on: ${{ matrix.os }}
    # Do not run this job in forks, as the deployment to GitHub pages will fail
    # unless it has GITHUB_TOKEN permissions from a user within the GaloisInc
    # organization (see #2216). Also exclude dependabot, because it apparently
    # works like a fork but isn't one. See crucible #1642 for discussion.
    if: needs.config.outputs.want-coverage == true
    strategy:
      matrix:
        suite: ['integration-tests']
        os: [ubuntu-24.04]
    steps:
      - name: Report relevant config
        run: |
          echo "Want coverage: ${{ needs.config.outputs.want-coverage }}"

      # Need a copy of the source to generate coverage HTML
      - name: Check out the repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Set up Haskell
        uses: haskell-actions/setup@v2
        id: setup-haskell
        with:
          ghc-version: "9.6.7"

      - name: Download what4-solvers
        uses: GaloisInc/what4-solvers@v1
        with:
          dest: bin
          release: ${{ env.SOLVER_PKG_VERSION }}

      - name: Add what4-solvers to GITHUB_PATH
        shell: bash
        run: echo "$PWD/bin" >> $GITHUB_PATH

      - name: Download the with-coverage test bins
        uses: actions/download-artifact@v4
        with:
          name: dist-tests-${{ matrix.os }}-hpc
          path: dist-tests

      - name: Download the coverage files
        uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.os }}-hpc.tar.gz"

      - name: Set up test environment
        shell: bash
        run: |
          tar xvf hpc.tar.gz
          chmod +x dist/bin/*
          chmod +x bin/*
          chmod +x dist-tests/*

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "8"
          java-package: jdk

      # NOTE: This job uses the SMT solver cache to improve performance but it
      # does not save the updated SMT solver cache. This is because the
      # `cabal-test` also runs the integration tests and uploads an updated
      # cache. Because the test suite is the same, the resulting cache files
      # would also be identical.
      - name: Restore SMT solver result cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ matrix.suite }}.cache
          key: ${{ env.SOLVER_CACHE_VERSION }}-solver-${{ matrix.suite }}-${{ matrix.os }}-${{ github.sha }}
          restore-keys: |
            ${{ env.SOLVER_CACHE_VERSION }}-solver-${{ matrix.suite }}-${{ matrix.os }}-

      - name: Enable solver caching
        shell: bash
        run: |
          echo "SAW_SOLVER_CACHE_PATH=$(pwd)/${{ matrix.suite }}.cache" >> "$GITHUB_ENV"
          dist/bin/saw --clean-mismatched-versions-solver-cache=$(pwd)/${{ matrix.suite }}.cache

      - name: Run integration tests
        shell: bash
        run: |
          export PATH="$PWD/dist/bin:$PATH"
          dist-tests/integration-tests
        env:
          ENABLE_HPC: true

      - name: Compute coverage
        shell: bash
        run: |
          ./compute-coverage.sh

      - name: Upload the coverage data
        uses: actions/upload-artifact@v5
        with:
          path: hpc-html
          name: coverage-html-${{ github.event.number }}

      - name: Gather HPC coverage files
        run: .github/ci.sh collect_all_html
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Deploy coverage reports
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: all-html
          destination_dir: coverage
          keep_files: false

  s2n-tests:
    name: "Test s2n proofs: ${{ matrix.s2n-target }}"
    timeout-minutes: 150
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        s2n-target:
          - hmac
          - drbg
          - sike
          - bike
          - tls
          - hmac-failure
          # 20250328: disabled temporarily because it now tickles #1094 (see #2273)
          # - awslc
          - blst
        os: [ubuntu-24.04]
        ghc: ["9.6.7"]
    steps:
      - name: Check out the repository without submodules
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Create bin dir
        run: |
          mkdir -p s2nTests/bin

      - name: Download previously-built SAW
        uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.os }}-bins"
          path: ./s2nTests/bin

      - name: Do docker-compose pull
        shell: bash
        working-directory: s2nTests
        run: |
          docker compose pull --ignore-buildable
          grep -h '^FROM' docker/*.dockerfile | sort -u | awk '{print $2}' | xargs -n1 -P8 docker pull

      - name: Do docker-compose build
        shell: bash
        working-directory: s2nTests
        run: docker compose build s2n

      - name: Restore SMT solver result cache
        uses: actions/cache/restore@v6
        with:
          path: s2nTests/cache
          key: ${{ env.SOLVER_CACHE_VERSION }}-solver-s2n-${{ matrix.s2n-target }}-${{ matrix.ghc }}-${{ github.sha }}
          restore-keys:
            ${{ env.SOLVER_CACHE_VERSION }}-solver-s2n-${{ matrix.s2n-target }}-${{ matrix.ghc }}-

      - name: "Run s2n tests: ${{ matrix.s2n-target }}"
        shell: bash
        working-directory: s2nTests
        run: |
          chmod +x bin/*
          mkdir -p cache && touch cache/data.mdb cache/lock.mdb
          chmod -R +rw cache
          make ${{ matrix.s2n-target }}

      - name: Save SMT solver result cache
        uses: actions/cache/save@v6
        if: always()
        with:
          path: s2nTests/cache
          key: ${{ env.SOLVER_CACHE_VERSION }}-solver-s2n-${{ matrix.s2n-target }}-${{ matrix.ghc }}-${{ github.sha }}

  exercises:
    name: "Test SAW exercises"
    needs: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04]
        ghc: ["9.6.7"]
    steps:
      - name: Check out the repository without submodules
        uses: actions/checkout@v7
        with:
          submodules: false
      - name: Create bin dir
        run: |
          mkdir -p exercises/bin

      - name: Download previously-built SAW
        uses: actions/download-artifact@v4
        with:
          name: "${{ matrix.os }}-bins"
          path: ./exercises/bin

      - name: "Make the exercises container"
        shell: bash
        working-directory: exercises
        run: docker build -t exercises .

      - name: "Run the exercises"
        shell: bash
        working-directory: exercises
        run: |
          chmod +x bin/*
          docker run -v $PWD/bin:/saw-bin exercises

############################################################
#
# Misc jobs
#

# All of this is indented two spaces because it actually hangs under
# the "jobs:" line in the "job config" section above.

  # The source archives that github autogenerates for releases do not
  # include submodules, and also do not include submodule references, so
  # they are unbuildable and broken. See issue 2532.
  #
  # We only need one of these. Run it on Ubuntu so as to be sure to get GNU tar.
  source-archive:
    runs-on: ubuntu-24.04
    needs: [config]
    if: needs.config.outputs.want-source-archive == true
    strategy:
      fail-fast: false
    steps:
      - name: Report relevant config
        run: |
          echo "Want source archive: ${{ needs.config.outputs.want-source-archive }}"

      - name: Check out the repository with submodules
        uses: actions/checkout@v7
        with:
          submodules: true
      - name: Create the source distribution
        id: make-source-distribution
        shell: bash
        run: .github/ci.sh make_source_distribution ${{ needs.config.outputs.name }}
      - name: Sign the source distribution
        id: sign-source-distribution
        shell: bash
        run: .github/ci.sh sign ${{ needs.config.outputs.name }}-sources.tar.gz
        env:
          SIGNING_PASSPHRASE: ${{ secrets.SIGNING_PASSPHRASE }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
      - name: Upload the source distribution
        uses: actions/upload-artifact@v5
        with:
          name: ${{ needs.config.outputs.name }}-sources (full source distribution)
          path: ${{ needs.config.outputs.name }}-sources.tar.gz
          if-no-files-found: error
          retention-days: ${{ needs.config.outputs.retention-days }}
